[project]
name = "pbl2-second"
version = "0.1.0"
description = "任意の多面体からユニークな展開図を列挙し、JSON と PNG 画像で返す"
readme = "README.md"
requires-python = ">=3.13.11"
dependencies = [
    "fastapi>=0.139.0",
    "matplotlib>=3.10",
    "networkx>=3.6.1",
    "numpy>=2.5.0",
    "shapely>=2.1.2",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "types-networkx>=3.6.1.20260612",
    "types-shapely>=2.1.0.20260603",
]
